<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Recurso visual de medidor de gas usado por el menú de íconos. -->
  <defs>
    <clipPath id="body-clip">
      <rect x="100" y="152" width="312" height="344" rx="42" />
    </clipPath>
    <clipPath id="display-clip">
      <rect x="130" y="182" width="252" height="89" rx="14" />
    </clipPath>
  </defs>

  <g stroke="#08080A" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- Tuberías superiores -->
    <path d="M 93.5 36 H 159 A 55 55 0 0 1 214 91 V 152 H 174 V 91 A 15 15 0 0 0 159 76 H 93.5 Z" fill="#FDCD56" />
    <path d="M 418.5 36 H 353 A 55 55 0 0 0 298 91 V 152 H 338 V 91 A 15 15 0 0 1 353 76 H 418.5 Z" fill="#FDCD56" />

    <!-- Bridas laterales y collarines -->
    <rect x="67" y="15" width="26.5" height="82" rx="13.25" fill="#E5A922" />
    <rect x="418.5" y="15" width="26.5" height="82" rx="13.25" fill="#E5A922" />
    <rect x="156.5" y="107.5" width="75" height="19" rx="9.5" fill="#E5A922" />
    <rect x="280.5" y="107.5" width="75" height="19" rx="9.5" fill="#E5A922" />

    <!-- Cuerpo principal del medidor -->
    <rect x="100" y="152" width="312" height="344" rx="42" fill="#FFE074" stroke="none" />
    <rect x="100" y="474" width="312" height="24" fill="#F5BD33" stroke="none" clip-path="url(#body-clip)" />
    <rect x="100" y="152" width="312" height="344" rx="42" fill="none" />

    <!-- Banda horizontal central -->
    <rect x="78" y="310" width="356" height="28" rx="14" fill="#FCC419" />

    <!-- Pantalla del contador -->
    <rect x="130" y="182" width="252" height="89" rx="14" fill="#FFF3BF" stroke="none" />
    <rect x="130" y="182" width="252" height="14" fill="#FFE066" stroke="none" clip-path="url(#display-clip)" />
    <rect x="130" y="182" width="252" height="89" rx="14" fill="none" />

  </g>

  <!-- Números del contador (00003) -->
  <g fill="#08080A" font-family="&#39;Arial Rounded MT Bold&#39;, &#39;Nunito&#39;, &#39;Segoe UI&#39;, sans-serif" font-size="54" font-weight="800" text-anchor="middle" dominant-baseline="central">
    <text x="160" y="228">0</text>
    <text x="208" y="228">0</text>
    <text x="256" y="228">0</text>
    <text x="304" y="228">0</text>
    <text x="352" y="228">3</text>
  </g>

  <!-- Leyenda GAS en reemplazo de la llama -->
  <text x="256" y="422" fill="#08080A" font-family="&#39;Arial Rounded MT Bold&#39;, &#39;Nunito&#39;, &#39;Segoe UI&#39;, sans-serif" font-size="68" font-weight="900" letter-spacing="4" text-anchor="middle" dominant-baseline="central">GAS</text>
</svg>