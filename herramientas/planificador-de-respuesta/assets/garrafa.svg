  <path d="M 336 54 C 316 66 304 90 304 128" fill="none" stroke="#000000" stroke-width="15" stroke-linecap="round" />

  <!-- Válvula central -->
  <rect x="240" y="64" width="32" height="64" fill="#b6c4cf" stroke="#000000" stroke-width="15" stroke-linejoin="round" />
  <line x1="232" y1="64" x2="280" y2="64" stroke="#000000" stroke-width="15" stroke-linecap="round" />

  <!-- Soporte vertical izquierdo -->
  <rect x="136" y="40" width="40" height="32" fill="#cd2a37" />
  <rect x="136" y="72" width="40" height="32" fill="#e0656d" />
  <rect x="136" y="104" width="40" height="24" fill="#cd2a37" />
