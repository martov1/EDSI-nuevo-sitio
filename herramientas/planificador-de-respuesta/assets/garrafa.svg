  <path d="M 352 472 H 376 A 40 40 0 0 0 416 432" fill="none" stroke="#000000" stroke-width="15" stroke-linecap="round" />

  <!-- Banda horizontal superior -->
  <rect x="80" y="168" width="352" height="30" rx="12" ry="12" fill="#eb898f" />
  <path d="M 368 168 H 420 A 12 12 0 0 1 432 180 V 186 A 12 12 0 0 1 420 198 H 92 A 12 12 0 0 1 80 186 V 180 A 12 12 0 0 1 92 168 H 334" fill="none" stroke="#000000" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />

