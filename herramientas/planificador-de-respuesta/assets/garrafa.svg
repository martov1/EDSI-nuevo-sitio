  <path d="M 372 8 H 384 A 12 12 0 0 1 396 20 V 28 A 12 12 0 0 1 384 40 H 372 Z" fill="#cd2a37" />
  <rect x="316" y="8" width="80" height="32" rx="12" ry="12" fill="none" stroke="#000000" stroke-width="15" />

  <!-- Base inferior -->
  <path d="M 136 472 H 376 V 488 A 16 16 0 0 1 360 504 H 152 A 16 16 0 0 1 136 488 Z" fill="#cd2a37" />
  <path d="M 136 472 V 488 A 16 16 0 0 0 152 504 H 360 A 16 16 0 0 0 376 488 V 472" fill="none" stroke="#000000" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cuerpo principal del cilindro -->
  <path d="M 96 168 A 40 40 0 0 1 136 128 H 376 A 40 40 0 0 1 416 168 V 432 A 40 40 0 0 1 376 472 H 136 A 40 40 0 0 1 96 432 Z" fill="#e0656d" />

  <!-- Sombreado derecho en cúpula superior e inferior -->
