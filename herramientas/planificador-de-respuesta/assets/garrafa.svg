  <path d="M 256 296 C 256 296 228 324 228 346 C 228 362 240 374 256 374 C 272 374 284 362 284 346 C 284 324 256 296 256 296 Z" fill="#dd8b36" stroke="#000000" stroke-width="15" stroke-linejoin="round" />
</svg>