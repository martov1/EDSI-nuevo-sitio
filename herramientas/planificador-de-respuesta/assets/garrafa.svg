  <line x1="176" y1="40" x2="176" y2="128" stroke="#000000" stroke-width="15" />

  <!-- Soporte vertical derecho -->
  <rect x="336" y="40" width="40" height="32" fill="#cd2a37" />
  <rect x="336" y="72" width="40" height="32" fill="#e0656d" />
  <rect x="336" y="104" width="40" height="24" fill="#cd2a37" />
  <line x1="336" y1="40" x2="336" y2="128" stroke="#000000" stroke-width="15" />
  <line x1="376" y1="40" x2="376" y2="128" stroke="#000000" stroke-width="15" />

  <!-- Asa superior izquierda -->
  <rect x="116" y="8" width="80" height="32" rx="12" ry="12" fill="#eb898f" />
  <path d="M 172 8 H 184 A 12 12 0 0 1 196 20 V 28 A 12 12 0 0 1 184 40 H 172 Z" fill="#cd2a37" />
  <rect x="116" y="8" width="80" height="32" rx="12" ry="12" fill="none" stroke="#000000" stroke-width="15" />

  <!-- Asa superior derecha -->
