  </g>

  <!-- Contorno del cuerpo principal -->
  <path d="M 96 168 A 40 40 0 0 1 136 128 H 376 A 40 40 0 0 1 416 168" fill="none" stroke="#000000" stroke-width="15" stroke-linecap="round" />
  <line x1="96" y1="198" x2="96" y2="402" stroke="#000000" stroke-width="15" />
