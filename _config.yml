# Identidad del sitio
title: EDSI - Escuela de Seguridad Industrial
description: Capacitación en seguridad industrial, combate de incendios, brigadas, autoelevadores (Res. 960/2015) y primeros auxilios. Cursos presenciales para empresas y virtuales para particulares en Buenos Aires.
url: "https://www.edsi.com.ar"
baseurl: ""

# Idioma, región y formato de las URLs
lang: es_AR
locale: es_AR
permalink: pretty

# Procesamiento y compilación
markdown: kramdown
highlighter: rouge

sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

# SEO y redes sociales
author: EDSI

social:
  name: EDSI - Escuela de Seguridad Industrial
  links:
    - https://www.facebook.com/profile.php?id=61585924482145
    - https://www.instagram.com/edsi.ar/
    - https://www.linkedin.com/company/escuela-de-seguridad-industrial/?viewAsMember=true

# Archivos y carpetas que Jekyll no debe incluir en el build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md

# Datos de contacto
email: "info@edsi.com.ar"
email_subject: "Consulta sobre servicios de capacitación - WEB"
email_subject_particular: "Consulta sobre servicios de capacitación - WEB - Particular"
email_subject_empresa: "Consulta sobre servicios de capacitación - WEB - Empresa"

